[package]
name = "idrop-sftp-e2e"
version = "0.1.0"
edition = "2021"

# iDrop의 src-tauri/src/sftp.rs를 #[path]로 직접 포함해 검증한다 (복사본 드리프트 없음).
# 대상 서버는 WSL의 실제 OpenSSH sftp-server (127.0.0.1:2222) — README 참고.

[dependencies]
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["sync", "macros", "time", "net", "io-util", "fs", "rt-multi-thread"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
rand = { version = "0.10", features = ["thread_rng"] }
sha2 = "0.11.0-rc.3"
async-trait = "0.1"
