<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iDrop</title>
  </head>
  <body>
    <div id="app">
      <!-- 상단바: 사이트 관리 + 퀵커넥트 -->
      <header id="topbar">
        <img id="logo" src="/iDrop.png" alt="iDrop" />
        <button id="sites-open" type="button" data-i18n="top.sites">사이트</button>
        <input id="qc-host" type="text" data-i18n-placeholder="top.host" spellcheck="false" />
        <input id="qc-port" type="text" value="22" data-i18n-placeholder="top.port" spellcheck="false" />
        <input id="qc-user" type="text" data-i18n-placeholder="top.user" spellcheck="false" />
        <input id="qc-pass" type="password" data-i18n-placeholder="top.pass" />
        <button id="qc-connect" type="button" data-i18n="top.connect">빠른 연결</button>
        <span id="status"></span>
      </header>

      <!-- 듀얼 패널 -->
      <div id="panels">
        <section class="panel" id="panel-local">
          <div class="panel-head">
            <span data-i18n="panel.local">로컬</span>
            <select id="local-drives"></select>
            <input id="local-path" type="text" spellcheck="false" />
            <button class="icon" id="local-mkdir" type="button" data-i18n-title="panel.newFolder">📁+</button>
            <button class="icon" id="local-hidden" type="button" data-i18n-title="panel.hidden">👁</button>
            <button class="icon" id="local-refresh" type="button" data-i18n-title="panel.refresh">⟳</button>
          </div>
          <div class="panel-body" id="local-list" tabindex="0"></div>
        </section>
        <div id="panel-divider"></div>
        <section class="panel" id="panel-remote">
          <div class="panel-head">
            <span data-i18n="panel.remote">원격</span>
            <input id="remote-path" type="text" spellcheck="false" />
            <button class="icon" id="remote-mkdir" type="button" data-i18n-title="panel.newFolder">📁+</button>
            <button class="icon" id="remote-hidden" type="button" data-i18n-title="panel.hidden">👁</button>
            <button class="icon" id="remote-refresh" type="button" data-i18n-title="panel.refresh">⟳</button>
          </div>
          <div class="panel-body" id="remote-list" tabindex="0"></div>
        </section>
      </div>

      <!-- 전송 큐 -->
      <div id="queue-divider"></div>
      <section id="queue">
        <div id="queue-head">
          <span data-i18n="queue.title">전송 큐</span>
          <span id="queue-summary"></span>
          <span class="spacer"></span>
          <button class="icon" id="q-cancel" type="button" data-i18n-title="queue.cancel">✕</button>
          <button class="icon" id="q-retry" type="button" data-i18n-title="queue.retry">↻</button>
          <button class="icon" id="q-clear" type="button" data-i18n-title="queue.clear">🧹</button>
        </div>
        <div id="queue-body"></div>
      </section>
    </div>
    <!-- 사이트 관리자 -->
    <div id="sites-modal" class="hidden">
      <div class="sites-box">
        <div class="sites-head">
          <h3 data-i18n="sites.title">사이트 관리자</h3>
          <button id="sites-close" type="button" class="x">✕</button>
        </div>
        <div class="sites-main">
          <div class="sites-left">
            <div id="sites-list"></div>
            <div class="sites-left-btns">
              <button id="sf-new" type="button" data-i18n="sites.new">새 사이트</button>
              <button id="sf-import" type="button" data-i18n="sites.import">가져오기</button>
              <button id="sf-import-putty" type="button">PuTTY</button>
            </div>
          </div>
          <div class="sites-form">
            <label data-i18n="sites.name">이름</label>
            <input id="sf-name" type="text" spellcheck="false" />
            <label data-i18n="sites.group">그룹</label>
            <input id="sf-group" type="text" spellcheck="false" />
            <label data-i18n="top.host">호스트</label>
            <input id="sf-host" type="text" spellcheck="false" />
            <label data-i18n="top.port">포트</label>
            <input id="sf-port" type="text" value="22" spellcheck="false" />
            <label data-i18n="top.user">사용자</label>
            <input id="sf-user" type="text" spellcheck="false" />
            <label data-i18n="top.pass">비밀번호</label>
            <input id="sf-pass" type="password" />
            <label data-i18n="sites.enc">파일명 인코딩</label>
            <select id="sf-enc">
              <option value="auto">자동</option>
              <option value="utf-8">UTF-8</option>
              <option value="euc-kr">EUC-KR</option>
            </select>
            <div class="sites-form-btns">
              <button id="sf-save" type="button" data-i18n="sites.save">저장</button>
              <button id="sf-connect" type="button" class="primary" data-i18n="sites.connect">접속</button>
            </div>
          </div>
        </div>
      </div>
      <input id="sf-import-file" type="file" multiple accept=".csv,.xsh,.xts" class="hidden" />
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
